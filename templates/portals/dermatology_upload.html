{% extends "base.html" %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <h2 class="mb-3">Skin Lesion Diagnostic Engine</h2>
    <p class="text-muted">Upload a clear dermoscopy image to analyze for Nevus vs. Malignant Melanoma using the EfficientNet-B0 model.</p>

    <form action="{{ url_for('dermatology.analyze_lesion') }}" method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label for="file" class="form-label font-weight-bold">Select Lesion Image (.jpg, .png)</label>
            <input type="file" class="form-control" id="file" name="file" accept="image/*" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Run Inference</button>
    </form>
</div>
{% endblock %}
