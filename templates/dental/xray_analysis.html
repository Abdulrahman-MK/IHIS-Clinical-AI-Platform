<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI X-Ray Analysis - IHIS Dental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{{ url_for('dental.index') if 'dental.index' in url_map else '#' }}">
                <i class="fas fa-tooth me-2"></i>IHIS Dental Portal
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-light btn-sm">
                <i class="fas fa-arrow-left me-1"></i> Back
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow border-0 rounded-3">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0 fw-bold"><i class="fas fa-x-ray me-2"></i>Dental X-Ray U-Net Segmentation</h4>
                    </div>
                    <div class="card-body p-4">
                        <!-- Removed method="POST" to prevent native browser navigation -->
                        <form id="xrayForm" onsubmit="event.preventDefault(); runAnalysis(); return false;" enctype="multipart/form-data">
                            <div class="mb-4">
                                <label for="xray" class="form-label fw-bold text-secondary">Upload Dental X-Ray Image</label>
                                <input type="file" class="form-control form-control-lg" id="xray" name="xray" accept="image/*" required>
                                <div class="form-text mt-2">Accepted formats: PNG, JPG, JPEG.</div>
                            </div>
                            
                            <!-- Changed type from "submit" to "button" to block browser POST navigation -->
                            <button type="button" id="submitBtn" onclick="runAnalysis()" class="btn btn-primary btn-lg w-100 shadow-sm fw-bold">
                                <i class="fas fa-microchip me-2"></i>Run AI Analysis
                            </button>
                        </form>

                        <!-- Error Alert Banner -->
                        <div id="errorAlert" class="alert alert-danger mt-3 d-none" role="alert"></div>

                        <!-- Results Display (3 Columns: Original, Mask, Overlay) -->
                        <div id="resultsContainer" class="mt-4 d-none">
                            <hr>
                            <h5 class="fw-bold mb-3 text-center">Segmentation Results</h5>
                            <div class="row text-center">
                                <div class="col-md-4 mb-3">
                                    <p class="fw-semibold text-muted">Original X-Ray</p>
                                    <img id="originalImg" class="img-fluid rounded border shadow-sm" alt="Original X-Ray">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <p class="fw-semibold text-muted">Binary Mask</p>
                                    <img id="maskImg" class="img-fluid rounded border shadow-sm" alt="AI Binary Mask">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <p class="fw-semibold text-muted">Color Overlay</p>
                                    <img id="overlayImg" class="img-fluid rounded border shadow-sm" alt="AI Color Overlay">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function runAnalysis() {
            const fileInput = document.getElementById('xray');
            const submitBtn = document.getElementById('submitBtn');
            const errorAlert = document.getElementById('errorAlert');
            const resultsContainer = document.getElementById('resultsContainer');
            
            errorAlert.classList.add('d-none');
            resultsContainer.classList.add('d-none');
            
            if (!fileInput.files || !fileInput.files[0]) {
                errorAlert.textContent = 'Please select an image file first.';
                errorAlert.classList.remove('d-none');
                return;
            }

            const formData = new FormData();
            formData.append('xray', fileInput.files[0]);

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Analyzing...';

            try {
                const response = await fetch("{{ url_for('dental.analyze_xray') }}", {
                    method: 'POST',
                    body: formData
                });

                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error(`Server returned non-JSON response (${response.status}). Check server logs.`);
                }

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to process image.');
                }

                if (data.mask) {
                    // Preview original uploaded image
                    document.getElementById('originalImg').src = URL.createObjectURL(fileInput.files[0]);

                    // Render predicted binary mask
                    document.getElementById('maskImg').src = `data:image/png;base64,${data.mask}`;
                    
                    // Render color overlay
                    document.getElementById('overlayImg').src = `data:image/png;base64,${data.overlay || data.mask}`;
                    
                    resultsContainer.classList.remove('d-none');
                } else {
                    throw new Error('No segmentation mask was returned from the server.');
                }
            } catch (err) {
                errorAlert.textContent = err.message;
                errorAlert.classList.remove('d-none');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-microchip me-2"></i>Run AI Analysis';
            }
        }
    </script>
</body>
</html>
